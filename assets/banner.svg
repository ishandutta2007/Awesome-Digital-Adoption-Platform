<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-bg { fill: url(#grid); }
    
    /* Dynamic floating particles & elements in background */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(18px) rotate(-4deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes pathFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .floating-card-1 { animation: float1 6s ease-in-out infinite; }
    .floating-card-2 { animation: float2 7s ease-in-out infinite; }
    .glow-circle-1 { animation: pulseGlow 5s ease-in-out infinite; transform-origin: 200px 100px; }
    .glow-circle-2 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 1000px 300px; }
    
    .animated-line {
      stroke-dasharray: 20 10;
      animation: pathFlow 12s linear infinite;
    }

    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" class="bg" rx="16" />
  <rect width="1200" height="400" class="grid-bg" rx="16" />

  <!-- Animated Glowing Background Orbs -->
  <circle cx="200" cy="100" r="180" fill="#3b82f6" opacity="0.15" class="glow-circle-1" filter="url(#shadow)" />
  <circle cx="1000" cy="300" r="220" fill="#8b5cf6" opacity="0.15" class="glow-circle-2" filter="url(#shadow)" />

  <!-- Background Dynamic Flow Lines (behind content) -->
  <path d="M 100 320 Q 300 250 500 340 T 900 280 T 1100 350" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="3" class="animated-line" />
  <path d="M 50 100 Q 350 40 600 120 T 1150 80" fill="none" stroke="#818cf8" stroke-opacity="0.15" stroke-width="2" class="animated-line" />

  <!-- Dynamic UI Mockup Cards in Background (Lower Opacity / Scaled to avoid covering main text) -->
  <g class="floating-card-1" opacity="0.6">
    <rect x="70" y="260" width="220" height="90" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" filter="url(#shadow)" />
    <rect x="90" y="280" width="80" height="10" rx="5" fill="#38bdf8" opacity="0.8" />
    <rect x="90" y="300" width="140" height="8" rx="4" fill="#64748b" opacity="0.5" />
    <rect x="90" y="316" width="110" height="8" rx="4" fill="#64748b" opacity="0.3" />
    <circle cx="250" cy="305" r="16" fill="#38bdf8" opacity="0.2" />
    <polygon points="246,305 254,300 254,310" fill="#38bdf8" />
  </g>

  <g class="floating-card-2" opacity="0.6">
    <rect x="910" y="50" width="230" height="110" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" filter="url(#shadow)" />
    <rect x="930" y="70" width="100" height="12" rx="6" fill="#c084fc" opacity="0.8" />
    <rect x="930" y="94" width="160" height="8" rx="4" fill="#64748b" opacity="0.5" />
    <rect x="930" y="110" width="130" height="8" rx="4" fill="#64748b" opacity="0.3" />
    <circle cx="1090" cy="100" r="14" fill="#22c55e" opacity="0.2" />
    <path d="M 1084 100 L 1088 104 L 1096 96" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground Title and Subtitle Container (Clean & Readable) -->
  <g transform="translate(600, 185)" text-anchor="middle">
    <!-- Category Pillar Pill -->
    <g transform="translate(-140, -115)">
      <rect x="0" y="0" width="280" height="34" rx="17" fill="#0f2b48" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="140" y="22" text-anchor="middle" class="badge-text">✨ CURATED DAP ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text y="-30" class="main-title" filter="url(#glow)">Awesome Digital Adoption Platform</text>
    
    <!-- Subtitle -->
    <text y="20" class="subtitle">In-App Guidance • User Onboarding • Product Tours • Walkthroughs</text>

    <!-- Sub-tagline -->
    <text y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#64748b">
      Complete Guide to SaaS Platforms &amp; Open-Source GitHub Libraries
    </text>
  </g>
</svg>
