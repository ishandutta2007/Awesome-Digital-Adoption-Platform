<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".03" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="shadow" width="160%" height="160%" x="-30%" y="-30%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".5" stdDeviation="15"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="coloredBlur" stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(2deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(12px) rotate(-2deg)}}@keyframes pulseGlow{0%{opacity:.25}50%{opacity:.5}}@keyframes pathFlow{0%{stroke-dashoffset:400}}.bg{fill:url(#bgGrad)}.grid-bg{fill:url(#grid)}.floating-card-1,.floating-card-2{animation:float1 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.floating-card-2{animation:float2 7s ease-in-out infinite}.glow-circle-1{animation:pulseGlow 5s ease-in-out infinite}.glow-circle-2{animation:pulseGlow 6s ease-in-out infinite}.animated-line{stroke-dasharray:20 10;animation:pathFlow 12s linear infinite}.main-title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:46px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text,.subtag-text,.subtitle{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.subtag-text{font-size:15px;fill:#64748b}</style><rect width="1200" height="400" class="bg" rx="16"/><rect width="1200" height="400" class="grid-bg" rx="16"/><circle cx="200" cy="100" r="180" fill="#3b82f6" class="glow-circle-1" filter="url(#shadow)" opacity=".15"/><circle cx="1000" cy="300" r="220" fill="#8b5cf6" class="glow-circle-2" filter="url(#shadow)" opacity=".15"/><path fill="none" stroke="#38bdf8" stroke-opacity=".2" stroke-width="3" d="M 100 320 Q 300 250 500 340 T 900 280 T 1100 350" class="animated-line"/><path fill="none" stroke="#818cf8" stroke-opacity=".15" stroke-width="2" d="M 50 100 Q 350 40 600 120 T 1150 80" class="animated-line"/><g class="floating-card-1" opacity=".6"><rect width="220" height="90" x="70" y="260" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".1" filter="url(#shadow)" rx="12"/><rect width="80" height="10" x="90" y="280" fill="#38bdf8" opacity=".8" rx="5"/><rect width="140" height="8" x="90" y="300" fill="#64748b" opacity=".5" rx="4"/><rect width="110" height="8" x="90" y="316" fill="#64748b" opacity=".3" rx="4"/><circle cx="250" cy="305" r="16" fill="#38bdf8" opacity=".2"/><polygon fill="#38bdf8" points="246 305 254 300 254 310"/></g><g class="floating-card-2" opacity=".6"><rect width="230" height="110" x="910" y="50" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".1" filter="url(#shadow)" rx="12"/><rect width="100" height="12" x="930" y="70" fill="#c084fc" opacity=".8" rx="6"/><rect width="160" height="8" x="930" y="94" fill="#64748b" opacity=".5" rx="4"/><rect width="130" height="8" x="930" y="110" fill="#64748b" opacity=".3" rx="4"/><circle cx="1090" cy="100" r="14" fill="#22c55e" opacity=".2"/><path fill="none" stroke="#22c55e" stroke-linecap="round" stroke-width="2" d="M 1084 100 L 1088 104 L 1096 96"/></g><g transform="translate(460, 70)"><rect width="280" height="34" x="0" y="0" fill="#0f2b48" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5" rx="17"/><text x="140" y="22" class="badge-text" text-anchor="middle">✨ CURATED DAP ECOSYSTEM</text></g><text x="600" y="160" class="main-title" filter="url(#glow)" text-anchor="middle">Awesome Digital Adoption Platform</text><text x="600" y="210" class="subtitle" text-anchor="middle">In-App Guidance • User Onboarding • Product Tours • Walkthroughs</text><text x="600" y="250" class="subtag-text" text-anchor="middle">Complete Guide to SaaS Platforms &amp; Open-Source GitHub Libraries</text></svg>